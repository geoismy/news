.mapcell svg{display:block;width:100%;height:auto;overflow:hidden}
.land{fill:none;stroke:#6f6ba8;stroke-opacity:.55;stroke-linecap:round}
.kland{fill:none;stroke:#4e4b7a;stroke-opacity:.6;stroke-linecap:round}
.kland.kr{stroke:#8f8ad0;stroke-opacity:.75}
.arc{fill:none;stroke:url(#arcGrad);stroke-width:1.1;stroke-opacity:.7;stroke-dasharray:4 6;animation:dash 6s linear infinite}
.arc.on{stroke-opacity:1;stroke-width:1.8}
.arcs.dim .arc:not(.on){stroke-opacity:.08}
@keyframes dash{to{stroke-dashoffset:-100}}
.bub{fill:#ffd166;fill-opacity:.55;stroke:#ffd166;stroke-opacity:.9;stroke-width:1;cursor:pointer;transition:fill-opacity .2s}
.bub.recent{fill-opacity:.85}
.bub:hover,.bub.on{fill-opacity:1;stroke:#fff;stroke-width:1.6}
.bub.kr{fill:#8ecae6;stroke:#8ecae6}
.pulse{fill:none;stroke:#ffd166;stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite;pointer-events:none}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(3.2);opacity:0}}
.krframe{fill:none;stroke:#8ecae6;stroke-opacity:.6;stroke-dasharray:3 3}
.mlabels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.mapcell svg{touch-action:pan-y;user-select:none;-webkit-user-select:none}

.zoomctl{position:absolute;right:4px;top:4px;display:flex;flex-direction:column;gap:4px;z-index:2}

</style>

<script>
/* ▼ 발행본4 CSV 공개 주소 (파일 → 공유 → 웹에 게시) */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT6U4saJYXK6x-nMabUrrwouaPBSFBZUSwIjEaApMlS70C63wzH7gkRd3a50zPjA9YGzUo96Ak71MYN/pub?gid=1528413879&single=true&output=csv";
/* ▼ 카카오톡 오픈채팅방 주소 */
const KAKAO_URL = "https://open.kakao.com/o/gLQT2WTi";

const EMOJI = {"지형":"🏔️","기후":"🌦️","자연재해":"🌋","도시·촌락":"🏘️","교통":"✈️","인구":"👥","경제":"💰","문화":"🏛️","생물":"🌿","정치·지정학":"🌐","자원·에너지":"⚡","AI·지리정보기술":"🗺️","여행":"🧳","보건·질병":"🩺","교육":"🧭","와우":"😆"};

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const splitTags = s => String(s||"").split(/[,，]/).map(t=>t.replace(/^#/,"").trim()).filter(Boolean);
function normDate(v){
  const m = String(v||"").match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return m ? `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}` : "";
}
/* 한국 시간 기준 오늘 날짜 "YYYY-MM-DD" (보는 사람 컴퓨터 시간대와 상관없이) */
function kstToday(offsetDays=0){
  const t = new Date(Date.now() + 9*3600e3 - offsetDays*86400e3);
  return t.toISOString().slice(0,10);
}
function md(d){ const [,m,dd]=d.split("-").map(Number); return `${m}월 ${dd}일`; }
/* 카드 꼬리표: 오늘 / 어제 / 10월 28일 */
function dayLabel(d){ return d===kstToday() ? "오늘" : d===kstToday(1) ? "어제" : md(d); }
/* 날짜 제목: 11월 2일 오늘의 소식 / 11월 1일 어제의 소식 / 10월 28일 (화) 소식 */
function dayTitle(d){
  if (d===kstToday()) return `${md(d)} 오늘의 소식`;
  if (d===kstToday(1)) return `${md(d)} 어제의 소식`;
  return `${fmtDate(d)} 소식`;
}
function fmtDate(d){ const [y,m,dd]=d.split("-").map(Number); const w="일월화수목금토"[new Date(y,m-1,dd).getDay()]; return `${m}월 ${dd}일 (${w})`; }

let DATA = [], DATES = [], dayIdx = 0, gFilter = "all", catFilter = "";
let graph = null, heroGraph = null, heroPaused = false;

/* ---------- 데이터 ---------- */
async function load(){
  let rows = [], failed = false;
  try{
    const res = await fetch(CSV_URL, {cache:"no-store"});
    if (!res.ok) throw new Error("HTTP " + res.status);
    rows = Papa.parse(await res.text(), {header:true, skipEmptyLines:true}).data;
    if (!rows.some(r => r && normDate(r.날짜))) throw new Error("no rows");
  }catch(e){ console.warn(e); rows = []; failed = true; }
  DATA = rows
    .filter(r => r && normDate(r.날짜) && (r.제목 || r.요약))
    .map((r,i) => ({
      id:i, date:normDate(r.날짜), cat:String(r.분야||"").trim(),
      title:String(r.제목||"").trim(), summary:String(r.요약||"").trim(),
      regions:splitTags(r.지역태그), topics:splitTags(r.주제태그),
      link:String(r.링크||"").trim(), source:String(r.매체||"").trim()
    }));
  DATES = [...new Set(DATA.map(d=>d.date))].sort().reverse();
  if (failed){
    $("#notice").innerHTML = `<div class="notice">지금 소식을 불러오지 못했어요. 잠시 후 새로고침해 주세요.</div>`;
    $("#heroStats").textContent = "소식을 불러오지 못했어요";
    $("#todayTitle").textContent = "잠시 후 다시 열어 주세요";
    $("#prevDay").disabled = $("#nextDay").disabled = true;
    $("#archiveList").innerHTML = `<div class="empty">소식을 불러오지 못했어요</div>`;
    return;
  }
  renderToday(); renderCats(); renderArchive(); renderHero(); buildGraph();
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith("tag=")) openTag(h.slice(4), false, "graph");
  else if (h.startsWith("place=")) openPlace(h.slice(6), false);
  else if (h==="map") showView("map");
}

/* ---------- 그래프 공통 ---------- */
function graphData(filter){
  const nodes = new Map(), links = new Map();
  for (const d of DATA){
    const tags = [
      ...(filter!=="t" ? d.regions.map(t=>({id:t,type:"r"})) : []),
      ...(filter!=="r" ? d.topics.map(t=>({id:t,type:"t"})) : [])
    ];
    for (const t of tags){
      const key = t.type+":"+t.id;
      if (!nodes.has(key)) nodes.set(key,{id:key,name:t.id,type:t.type,count:0});
      nodes.get(key).count++;
    }
    for (let i=0;i<tags.length;i++) for (let j=i+1;j<tags.length;j++){
      const a=tags[i].type+":"+tags[i].id, b=tags[j].type+":"+tags[j].id;
      if (a===b) continue;
      const k = a<b ? a+"|"+b : b+"|"+a;
      if (!links.has(k)) links.set(k,{source:a<b?a:b,target:a<b?b:a,w:0});
      links.get(k).w++;
    }
  }
  return {nodes:[...nodes.values()], links:[...links.values()]};
}
const nodeR = n => Math.sqrt(2+n.count*2)*3;

function makeGraph(el, hero){
  const st = {hover:null, hiN:new Set(), hiL:new Set()};
  const g = ForceGraph()(el)
    .backgroundColor("rgba(0,0,0,0)")
    .nodeId("id")
    .nodeVal(n=>2+n.count*2)
    .linkColor(l=> st.hiL.size ? (st.hiL.has(l)?"rgba(236,234,255,.85)":"rgba(255,255,255,.05)") : "rgba(200,198,235,.2)")
    .linkWidth(l=> (st.hiL.has(l)?1.6:0.6)*Math.sqrt(l.w))
    .nodeCanvasObject((n,ctx,scale)=>{
      const r = nodeR(n);
      const dim = st.hiN.size && !st.hiN.has(n);
      const col = n.type==="r" ? "255,209,102" : "142,202,230";
      if (st.hiN.has(n) && !dim){
        ctx.beginPath(); ctx.arc(n.x,n.y,r*2.2,0,2*Math.PI);
        ctx.fillStyle=`rgba(${col},0.12)`; ctx.fill();
      }
      ctx.beginPath(); ctx.arc(n.x,n.y,r,0,2*Math.PI);
      ctx.fillStyle = `rgba(${col},${dim?0.15:0.95})`; ctx.fill();
      if (n===st.hover){ ctx.lineWidth=2/scale; ctx.strokeStyle="#fff"; ctx.stroke(); }
      const showLabel = hero ? (n.count>=2 || st.hiN.has(n)) : (scale>1.1 || n.count>=2 || st.hiN.has(n));
      if (showLabel){
        const fs = Math.max((hero?13:11)/scale, 3);
        ctx.font = `${n===st.hover?700:500} ${fs}px "Noto Sans KR",sans-serif`; ctx.textAlign="center"; ctx.textBaseline="top";
        ctx.fillStyle = dim ? "rgba(220,218,240,.18)" : "#e6e5f3";
        ctx.fillText(n.name, n.x, n.y+r+2/scale);
      }
    })
    .nodePointerAreaPaint((n,color,ctx)=>{ ctx.fillStyle=color; ctx.beginPath(); ctx.arc(n.x,n.y,nodeR(n)+4,0,2*Math.PI); ctx.fill(); })
    .onNodeClick(n=>openTag(n.name))
    .cooldownTicks(150);
  g.d3Force("charge").strength(hero?-120:-90);
  g._setHi = n => {
    st.hover=n||null; st.hiN.clear(); st.hiL.clear();
    if (n){ st.hiN.add(n); g.graphData().links.forEach(l=>{ if(l.source===n||l.target===n){ st.hiL.add(l); st.hiN.add(l.source); st.hiN.add(l.target);} }); }
  };
  g.onNodeHover(n=>{
    g._setHi(n); el.style.cursor = n ? "pointer" : "";
    if (hero){ heroPaused = !!n; if (n) showSpot(n); }
  });
  if (hero) g.enableZoomInteraction(false).enablePanInteraction(false).enableNodeDrag(false).autoPauseRedraw(false);
  new ResizeObserver(()=>{ if(el.clientWidth) g.width(el.clientWidth).height(el.clientHeight); }).observe(el);
  return g;
}

/* ---------- 히어로 ---------- */
function showSpot(n){
  const arts = DATA.filter(d=>d.regions.includes(n.name)||d.topics.includes(n.name)).length;
  const nb = new Set();
  heroGraph.graphData().links.forEach(l=>{ if(l.source===n) nb.add(l.target.name); if(l.target===n) nb.add(l.source.name); });
  const rel = [...nb].slice(0,3).map(t=>"#"+esc(t)).join(" ");
  $("#heroSpot").innerHTML = `지금 비추는 태그<span class="tg ${n.type}">#${esc(n.name)}</span> · 기사 ${arts}건${rel?` · ${rel}와 연결`:""}`;
}
function renderHero(){
  const regions = new Set(DATA.flatMap(d=>d.regions)), topics = new Set(DATA.flatMap(d=>d.topics));
  $("#heroStats").innerHTML = `지금까지 <b>${DATA.length}</b>개의 소식이 <b>${regions.size}</b>곳의 지역과 <b>${topics.size}</b>개의 주제로 이어져 있어요`;
  const el = $("#heroGraph");
  if (!window.ForceGraph) return;
  heroGraph = makeGraph(el, true);
  let fitted = false;
  heroGraph.onEngineStop(()=>{ if(!fitted){ fitted=true; heroGraph.zoomToFit(800, el.clientWidth<600?24:60); } });
  heroGraph.graphData(graphData("all"));
  const order = [...heroGraph.graphData().nodes].sort((a,b)=>b.count-a.count).slice(0,10);
  let i = 0;
  const tick = ()=>{ if(heroPaused || !order.length) return; const n=order[i++%order.length]; heroGraph._setHi(n); showSpot(n); };
  setTimeout(tick, 1600); setInterval(tick, 3200);
}

/* 뉴스 지도에서 지역을 누르면 지도 아래에, 그 밖에는 그래프 뷰에 모아 보여 줌 */
function openTag(tag, scroll=true, where){
  if (!where) where = (currentView()==="map" && GEO[tag]) ? "map" : "graph";
  if (where==="map") return openPlace(tag, scroll);
  showView("graph");
  const {list, rel} = tagList(tag);
  const isR = DATA.some(d=>d.regions.includes(tag));
  $("#tagPanel").innerHTML = tagPanelHTML(tag, list, rel, "closeTag");
  $("#closeTag").onclick=()=>{ $("#tagPanel").innerHTML=""; history.replaceState(null,"",location.pathname); graph && graph._setHi(null); };
  history.replaceState(null,"","#tag="+encodeURIComponent(tag));
  if (graph){
    setTimeout(()=>{
      const ns = graph.graphData().nodes;
      const n = ns.find(x=>x.name===tag && x.type===(isR?"r":"t")) || ns.find(x=>x.name===tag);
      if (n && n.x!=null){ graph._setHi(n); graph.centerAt(n.x,n.y,600); graph.zoom(2.2,600); }
    }, 150);
  }
  if (scroll) setTimeout(()=>$("#tagPanel").scrollIntoView({behavior:"smooth",block:"start"}), 200);
}

/* ---------- 뉴스 지도 (도트맵 + 버블) ---------- */
const MAP = {dm:null, loading:null, days:"all", pending:null, sel:null};
const SVGNS = "http://www.w3.org/2000/svg";
const KOREA_BOX = {lat0:33, lat1:43, lng0:124, lng1:131.5};
const inKorea = ([lat,lng]) => lat>=KOREA_BOX.lat0 && lat<=KOREA_BOX.lat1 && lng>=KOREA_BOX.lng0 && lng<=KOREA_BOX.lng1;
/* Natural Earth 투영 (d3-geo와 같은 식, 도트 생성 때 쓴 값으로 맞춤) */
function projW([lat,lng]){
  const W = MAP.dm.world, l = lng*Math.PI/180, p = lat*Math.PI/180, p2 = p*p, p4 = p2*p2;
  const X = l*(0.8707-0.131979*p2+p4*(-0.013791+p4*(0.003971*p2-0.001529*p4)));
  const Y = p*(1.007226+p2*(0.015085+p4*(-0.044475+0.028874*p2-0.005916*p4)));
  return [W.tx + W.s*X, W.ty - W.s*Y];
}
function projK([lat,lng]){ const K = MAP.dm.korea; return [(lng-K.lon0)*K.cos*K.k, (K.lat0-lat)*K.k]; }
const dotPath = (d, n) => { let s=""; for (let i=0;i<d.length;i+=n) s += `M${d[i]} ${d[i+1]}h0`; return s; };
const el = (tag, attrs={}, parent) => { const e=document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

function initMap(){
  if (MAP.loading) return MAP.loading;
  MAP.loading = fetch("/news/lib/dotmap.json").then(r=>r.json()).then(dm=>{
    MAP.dm = dm; buildMap();
    if (MAP.pending){ openPlace(MAP.pending, false); MAP.pending = null; }
  }).catch(e=>{ console.warn(e); $("#worldCell").innerHTML = '<div class="empty" style="color:#9aa">지도를 불러오지 못했어요</div>'; });
  return MAP.loading;
}

function buildMap(){
  const {world:W, korea:K} = MAP.dm;
  /* 세계 */
  const ws = el("svg", {viewBox:`0 0 ${W.W} ${W.H}`, id:"worldSvg", role:"img", "aria-label":"뉴스 지도"});
  const defs = el("defs", {}, ws);
  const g = el("linearGradient", {id:"arcGrad", gradientUnits:"userSpaceOnUse", x1:0, y1:0, x2:W.W, y2:0}, defs);
  el("stop", {offset:"0", "stop-color":"#8ecae6"}, g); el("stop", {offset:"1", "stop-color":"#ffd166"}, g);
  el("path", {class:"land", d:dotPath(W.dots,2), "stroke-width":W.r*2, "data-w0":W.r*2}, ws);
  const [fx0,fy0] = projW([KOREA_BOX.lat1, KOREA_BOX.lng0]), [fx1,fy1] = projW([KOREA_BOX.lat0, KOREA_BOX.lng1]);
  el("rect", {class:"krframe", x:fx0-3, y:fy0-3, width:fx1-fx0+6, height:fy1-fy0+6, rx:4}, ws);
  el("g", {class:"arcs", id:"worldArcs"}, ws); el("g", {id:"worldBubs"}, ws);
  $("#worldCell").innerHTML = ""; $("#worldCell").appendChild(ws);
  const wl = document.createElement("div"); wl.className = "mlabels"; wl.id = "worldLabels"; $("#worldCell").appendChild(wl);
  /* 한반도 */
  const ks = el("svg", {viewBox:`0 0 ${K.W} ${K.H}`, id:"koreaSvg", role:"img", "aria-label":"한반도 확대 지도"});
  const other = [], kr = [];
  for (let i=0;i<K.dots.length;i+=3) (K.dots[i+2] ? kr : other).push(K.dots[i], K.dots[i+1]);
  el("path", {class:"kland", d:dotPath(other,2), "stroke-width":K.r*2, "data-w0":K.r*2}, ks);
  el("path", {class:"kland kr", d:dotPath(kr,2), "stroke-width":K.r*2, "data-w0":K.r*2}, ks);
  el("g", {id:"koreaBubs"}, ks);
  $("#koreaCell").appendChild(ks);
  const kl = document.createElement("div"); kl.className = "mlabels"; kl.id = "koreaLabels"; $("#koreaCell").appendChild(kl);

  $("#mapLatest").textContent = DATES[0] ? dayLabel(DATES[0]) : "오늘";
  drawMapData();
  makeZoom(ws, $("#worldCell"), 6);
  makeZoom(ks, $("#koreaCell"), 8);
  new ResizeObserver(()=>placeLabels()).observe($("#mapWrap"));
}

/* 기간에 맞는 지역별 기사 수, 함께 나온 쌍 */
function mapData(){
  const latest = DATES[0];
  const from = MAP.days==="all" ? "" : MAP.days==="1" ? latest : kstToday(6);
  const cnt = new Map(), recent = new Set(), pairs = new Map(), krArts = new Set();
  for (const d of DATA){
    if (from && d.date < from) continue;
    const rs = [...new Set(d.regions)].filter(r=>GEO[r]);
    rs.forEach(r=>{ cnt.set(r,(cnt.get(r)||0)+1); if (d.date===latest) recent.add(r); if (inKorea(GEO[r])) krArts.add(d.id); });
    /* 세계 지도의 선: 한반도 안 지명은 "한반도" 하나로 묶어서 */
    const ws = [...new Set(rs.map(r=>inKorea(GEO[r]) ? "@한반도" : r))];
    for (let i=0;i<ws.length;i++) for (let j=i+1;j<ws.length;j++){
      const k=[ws[i],ws[j]].sort().join("|"); pairs.set(k,(pairs.get(k)||0)+1);
    }
  }
  const pts = [...cnt].map(([name,c])=>({name, c, recent:recent.has(name), kr:inKorea(GEO[name])}));
  return {pts, pairs, krCount:krArts.size, krRecent:pts.some(p=>p.kr&&p.recent)};
}

function drawMapData(){
  const {pts, pairs, krCount, krRecent} = mapData();
  MAP.pts = pts;
  const wb = $("#worldBubs"), wa = $("#worldArcs"), kb = $("#koreaBubs");
  wb.innerHTML = ""; wa.innerHTML = ""; kb.innerHTML = "";
  const rW = c => 3.5 + Math.sqrt(c)*4, rK = c => 4.5 + Math.sqrt(c)*4.2;
  const krCenter = projW([37.8, 127.6]);
  const posW = n => n==="@한반도" ? krCenter : projW(GEO[n]);
  /* 선 */
  for (const [k,w] of pairs){
    const [a,b] = k.split("|"), [x1,y1] = posW(a), [x2,y2] = posW(b);
    const dx = x2-x1, dy = y2-y1, dist = Math.hypot(dx,dy); if (dist < 8) continue;
    const mx = (x1+x2)/2, my = Math.min(y1,y2) - dist*0.18; // 위로 휘는 곡선
    const p = el("path", {class:"arc", d:`M${x1} ${y1}Q${mx} ${my} ${x2} ${y2}`}, wa);
    p.dataset.a = a; p.dataset.b = b; p.style.strokeWidth = (0.9 + Math.min(w,4)*0.35);
  }
  /* 버블: 큰 것부터 그려서 작은 게 위에 오게 */
  const bub = (parent, x, y, r, p, cls) => {
    const k = parent.closest("svg")._zoom ? parent.closest("svg")._zoom.k : 1, rr = r/Math.pow(k,ZOOM_SHRINK);
    if (p.recent) el("circle", {class:"pulse", cx:x, cy:y, r:rr, "data-r0":r}, parent);
    const c = el("circle", {class:`bub ${cls}${p.recent?" recent":""}`, cx:x, cy:y, r:rr, "data-r0":r}, parent);
    c.dataset.name = p.name; c.dataset.c = p.c;
    return c;
  };
  const world = pts.filter(p=>!p.kr).sort((a,b)=>b.c-a.c);
  world.forEach(p=>{ const [x,y] = projW(GEO[p.name]); bub(wb, x, y, rW(p.c), p, ""); });
  if (krCount){ const [x,y] = krCenter; bub(wb, x, y, rW(krCount), {name:"@한반도", c:krCount, recent:krRecent}, "kr"); }
  pts.filter(p=>p.kr).sort((a,b)=>b.c-a.c).forEach(p=>{ const [x,y] = projK(GEO[p.name]); bub(kb, x, y, rK(p.c), p, ""); });
  $("#koreaCell").style.opacity = krCount ? 1 : .5;
  bindBubbles();
  placeLabels();
  if (!pts.length) $("#mapPanel").innerHTML = `<div class="empty">이 기간에는 지도에 올릴 지역이 없어요</div>`;
}

/* 이름표: 큰 원부터, 겹치면 생략 (화면 크기에 맞춰 다시 계산) */
function placeLabels(){
  if (!MAP.pts) return;
  const doCell = (cellId, svgId, layerId, list, proj, max) => {
    const svg = $("#"+svgId), layer = $("#"+layerId); if (!svg) return;
    layer.innerHTML = "";
    const vb = svg.viewBox.baseVal, sc = svg.clientWidth / vb.width; if (!sc) return;
    const zk = svg._zoom ? svg._zoom.k : 1;
    max = Math.round(max * Math.min(zk, 3));
    const sb = svg.getBoundingClientRect(), cb = layer.getBoundingClientRect();
    const boxes = [];
    for (const p of list){
      if (boxes.length >= max) break;
      const ox = sb.left - cb.left, oy = sb.top - cb.top; // 제목 줄 등으로 밀린 만큼
      const [x0,y0] = proj(p), x = x0 - vb.x, y = y0 - vb.y;
      if (x < 0 || y < 0 || x > vb.width || y > vb.height) continue; // 확대해서 화면 밖
      const r = (p.r||0)/Math.pow(zk,ZOOM_SHRINK)*sc, px = ox + x*sc + r + 4, py = oy + y*sc;
      const label = p.label || p.name, w = label.length*12 + 8, h = 16;
      const box = [px, py-h/2, px+w, py+h/2];
      if (box[2] > ox + svg.clientWidth + 4) { box[0] = ox + x*sc - r - 4 - w; box[2] = ox + x*sc - r - 4; }
      if (boxes.some(b=>!(box[2]<b[0]||box[0]>b[2]||box[3]<b[1]||box[1]>b[3]))) continue;
      boxes.push(box);
      const d = document.createElement("div");
      d.className = "mlabel" + (p.recent?" recent":"") + (MAP.sel===p.name?" on":"");
      d.style.left = box[0]+"px"; d.style.top = py+"px"; d.textContent = label; d.dataset.name = p.name;
      layer.appendChild(d);
    }
  };
  const rW = c => 3.5 + Math.sqrt(c)*4, rK = c => 4.5 + Math.sqrt(c)*4.2;
  const order = (a,b)=>(b.recent-a.recent)||(b.c-a.c);
  const world = MAP.pts.filter(p=>!p.kr).map(p=>({...p, r:rW(p.c)}));
  const kr = $("#worldBubs .bub.kr");
  if (kr) world.push({name:"@한반도", label:"한반도", c:+kr.dataset.c, r:rW(+kr.dataset.c), recent:kr.classList.contains("recent"), at:[37.8,127.6]});
  const wide = $("#worldCell").clientWidth > 520;
  doCell("worldCell","worldSvg","worldLabels", world.sort(order), p=>projW(p.at||GEO[p.name]), wide?18:9);
  doCell("koreaCell","koreaSvg","koreaLabels", MAP.pts.filter(p=>p.kr).map(p=>({...p, r:rK(p.c)})).sort(order), p=>projK(GEO[p.name]), 12);
  $("#worldLabels").querySelectorAll(".mlabel").forEach(bindTarget);
  $("#koreaLabels").querySelectorAll(".mlabel").forEach(bindTarget);
}

function bindTarget(t){
  const name = t.dataset.name;
  t.addEventListener("mouseenter", e=>hoverPlace(name, e));
  t.addEventListener("mousemove", e=>moveTip(e));
  t.addEventListener("mouseleave", ()=>hoverPlace(null));
  t.addEventListener("click", ()=>{
    if (MAP.dragged) return;
    if (name==="@한반도"){ const k=$("#koreaCell"); k.classList.remove("flash"); void k.offsetWidth; k.classList.add("flash");
      if (innerWidth<=640) k.scrollIntoView({behavior:"smooth", block:"center"}); return; }
    openPlace(name);
  });
}
function bindBubbles(){ document.querySelectorAll("#v-map .bub").forEach(bindTarget); }

function hoverPlace(name, e){
  const tip = $("#mapTip"), arcs = $("#worldArcs");
  if (!name){ tip.style.opacity = 0; arcs.classList.remove("dim"); arcs.querySelectorAll(".arc.on").forEach(a=>a.classList.remove("on")); return; }
  const key = (name!=="@한반도" && GEO[name] && inKorea(GEO[name])) ? "@한반도" : name;
  arcs.querySelectorAll(".arc").forEach(a=>a.classList.toggle("on", a.dataset.a===key || a.dataset.b===key));
  arcs.classList.toggle("dim", !!arcs.querySelector(".arc.on"));
  if (name==="@한반도"){
    const n = $("#worldBubs .bub.kr").dataset.c;
    tip.innerHTML = `<b>한반도</b> · 기사 ${n}건<br><span style="color:#9a99ad">오른쪽 확대 지도에서 지역별로 볼 수 있어요</span>`;
  } else {
    const {list, rel} = tagList(name);
    const top = rel.slice(0,3).map(([t])=>"#"+esc(t)).join(" ");
    tip.innerHTML = `<b>#${esc(name)}</b> · 기사 ${list.length}건${top?`<br><span style="color:#9a99ad">${top}</span>`:""}`;
  }
  tip.style.opacity = 1; moveTip(e);
}
function moveTip(e){
  if (!e) return;
  const tip = $("#mapTip"), box = $("#mapWrap").getBoundingClientRect();
  let x = e.clientX - box.left + 14, y = e.clientY - box.top + 14;
  if (x + tip.offsetWidth > box.width - 6) x = e.clientX - box.left - tip.offsetWidth - 14;
  tip.style.left = x+"px"; tip.style.top = y+"px";
}

/* ---------- 지도 확대·이동 ----------
 * 버튼(+ − ⟲), 두 번 누르기, Ctrl+스크롤, 두 손가락 벌리기. 확대하면 끌어서 옮기기.
 * 확대할수록 점과 원은 덜 커지게(ZOOM_SHRINK) 해서 서로 떨어져 보이게 */
const ZOOM_SHRINK = 0.65;
function makeZoom(svg, cell, maxK){
  const W = svg.viewBox.baseVal.width, H = svg.viewBox.baseVal.height;
  const st = svg._zoom = {x:0, y:0, k:1};
  let raf = 0;
  const apply = () => {
    const w = W/st.k, h = H/st.k;
    st.x = Math.min(Math.max(st.x, 0), W-w); st.y = Math.min(Math.max(st.y, 0), H-h);
    svg.setAttribute("viewBox", `${st.x} ${st.y} ${w} ${h}`);
    svg.classList.toggle("zoomed", st.k > 1.01);
    const f = Math.pow(st.k, ZOOM_SHRINK);
    svg.querySelectorAll("[data-r0]").forEach(c=>c.setAttribute("r", c.dataset.r0/f));
    svg.querySelectorAll("[data-w0]").forEach(c=>c.setAttribute("stroke-width", c.dataset.w0/Math.pow(st.k,0.45)));
    reset.style.visibility = st.k > 1.01 ? "visible" : "hidden";
    cancelAnimationFrame(raf); raf = requestAnimationFrame(placeLabels);
  };
  const toSvg = (cx, cy) => { const r = svg.getBoundingClientRect(), w = W/st.k, h = H/st.k;
    return [st.x + (cx-r.left)/r.width*w, st.y + (cy-r.top)/r.height*h]; };
  const zoomAt = (k, px, py) => {
    k = Math.min(Math.max(k, 1), maxK);
    const w = W/st.k, h = H/st.k, fx = (px-st.x)/w, fy = (py-st.y)/h;
    st.k = k; st.x = px - fx*W/k; st.y = py - fy*H/k; apply();
  };
  const center = () => [st.x + W/st.k/2, st.y + H/st.k/2];
  /* 부드럽게 */
  const animateTo = (k, px, py) => {
    const k0 = st.k, t0 = performance.now();
    const step = t => { const a = Math.min((t-t0)/220, 1), e = 1-Math.pow(1-a,3);
      zoomAt(k0 + (k-k0)*e, px, py); if (a < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  };
  svg._zoomTo = (k, px, py) => animateTo(k, px, py);

  /* 버튼 */
  const ctl = document.createElement("div"); ctl.className = "zoomctl";
  ctl.innerHTML = `<button type="button" aria-label="확대">+</button><button type="button" aria-label="축소">−</button><button type="button" class="reset" aria-label="처음 크기로">⟲</button>`;
  const [plus, minus, reset] = ctl.querySelectorAll("button");
  plus.onclick = () => animateTo(st.k*1.8, ...center());
  minus.onclick = () => animateTo(st.k/1.8, ...center());
  reset.onclick = () => { const k0 = st.k; animateTo(1, W/2, H/2); };
  cell.appendChild(ctl);
  const hint = document.createElement("div"); hint.className = "zoomhint"; cell.appendChild(hint);
  let hintT = 0;
  const showHint = txt => { hint.textContent = txt; hint.classList.add("show"); clearTimeout(hintT); hintT = setTimeout(()=>hint.classList.remove("show"), 1300); };

  /* Ctrl(⌘)+스크롤: 그냥 스크롤은 페이지가 내려가게 둠 */
  svg.addEventListener("wheel", e => {
    if (!(e.ctrlKey || e.metaKey)){ showHint(/Mac/.test(navigator.platform) ? "⌘ + 스크롤로 확대해요" : "Ctrl + 스크롤로 확대해요"); return; }
    e.preventDefault(); zoomAt(st.k*Math.exp(-e.deltaY*0.0025), ...toSvg(e.clientX, e.clientY));
  }, {passive:false});
  /* 두 번 누르기 */
  svg.addEventListener("dblclick", e => { e.preventDefault(); const [px,py] = toSvg(e.clientX, e.clientY); animateTo(st.k >= maxK*0.95 ? 1 : st.k*2.2, px, py); });

  /* 끌기 · 두 손가락 */
  const pts = new Map(); let last = null, pinch = null, moved = 0;
  svg.addEventListener("pointerdown", e => {
    pts.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; MAP.dragged = false;
    if (pts.size === 2){ const [a,b] = [...pts.values()];
      pinch = {d:Math.hypot(a[0]-b[0], a[1]-b[1]), k:st.k, c:toSvg((a[0]+b[0])/2, (a[1]+b[1])/2)}; }
    last = [e.clientX, e.clientY];
  });
  window.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size >= 2 && pinch){
      const [a,b] = [...pts.values()], d = Math.hypot(a[0]-b[0], a[1]-b[1]);
      zoomAt(pinch.k * d/pinch.d, ...pinch.c); MAP.dragged = true; return;
    }
    if (st.k <= 1.01 || !last) return;
    const r = svg.getBoundingClientRect(), dx = e.clientX-last[0], dy = e.clientY-last[1];
    moved += Math.abs(dx) + Math.abs(dy); last = [e.clientX, e.clientY];
    if (moved > 4){ MAP.dragged = true; svg.classList.add("dragging"); hoverPlace(null); }
    st.x -= dx / r.width * W/st.k; st.y -= dy / r.height * H/st.k; apply();
  });
  const end = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size){ last = null; svg.classList.remove("dragging");
    setTimeout(()=>MAP.dragged = false, 0); } };
  window.addEventListener("pointerup", end); window.addEventListener("pointercancel", end);
  apply();
}

/* 지역 하나 열기: 지도에서 강조하고 아래에 기사 모으기 */
function openPlace(name, scroll=true){
  showView("map");
  if (!MAP.dm){ MAP.pending = name; return; }
  MAP.sel = name;
  document.querySelectorAll("#v-map .bub").forEach(b=>b.classList.toggle("on", b.dataset.name===name));
  document.querySelectorAll("#v-map .mlabel").forEach(b=>b.classList.toggle("on", b.dataset.name===name));
  const {list, rel} = tagList(name);
  let osm = "";
  if (GEO[name]){
    const [lat,lng] = GEO[name], z = inKorea(GEO[name]) && !["한국","대한민국","남한","북한"].includes(name) ? 11 : 5;
    osm = `<a class="osm" href="https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=${z}/${lat}/${lng}" target="_blank" rel="noopener">지도에서 보기 ↗</a>`;
  }
  $("#mapPanel").innerHTML = tagPanelHTML(name, list, rel, "closePlace", osm);
  $("#closePlace").onclick = ()=>{ $("#mapPanel").innerHTML=""; MAP.sel=null; history.replaceState(null,"",location.pathname);
    document.querySelectorAll("#v-map .on").forEach(b=>b.classList.remove("on")); };
  history.replaceState(null,"","#place="+encodeURIComponent(name));
  if (scroll) setTimeout(()=>$("#mapPanel").scrollIntoView({behavior:"smooth",block:"start"}), 150);
}
$("#mapFilters").addEventListener("click", e=>{
  const b=e.target.closest(".chip"); if(!b || !MAP.dm) return;
  MAP.days=b.dataset.d; document.querySelectorAll("#mapFilters .chip").forEach(x=>x.classList.toggle("on",x===b));
  $("#mapPanel").innerHTML=""; MAP.sel=null; drawMapData();
});

/* ---------- 공통 이벤트 ---------- */
function currentView(){ const s=document.querySelector(".view.on"); return s ? s.id.slice(2) : "today"; }
function showView(v){
  if (v==="map") initMap();
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.view===v));
  if (v==="graph" && graph){
    const el=$("#graph"); graph.width(el.clientWidth).height(el.clientHeight);
    if (!location.hash.startsWith("#tag=")) setTimeout(()=>graph.zoomToFit(400,40),60);
  }
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>showView(b.dataset.view));
document.addEventListener("click", async e=>{
  const t=e.target.closest(".tag"); if(t){ openTag(t.dataset.tag); return; }
});
if (KAKAO_URL){ $("#kakao").href = KAKAO_URL; $("#ftKakao").href = KAKAO_URL; } else $("#ftKakao").remove();

load();
</script>
