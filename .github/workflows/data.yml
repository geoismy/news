# 구글 시트 → 사이트 데이터 파일 (public/news/data)
# 30분마다, 또는 GitHub의 Actions 탭에서 "Run workflow"를 누르면 바로 실행돼요.
# n8n이 발행 직후 부르게 하려면 repository_dispatch(news-updated)를 보내면 돼요.
name: 소식 데이터 만들기
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [news-updated]
permissions:
  contents: write
concurrency:
  group: news-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 시트 읽어서 데이터 만들기
        run: node tools/build-data.js
      - name: 바뀐 게 있으면 올리기
        run: |
          git config user.name "geois-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/news/data
          if git diff --cached --quiet; then echo "바뀐 소식 없음"; exit 0; fi
          git commit -m "소식 데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
